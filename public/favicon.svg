<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="112" 
    fill="url(#bgGrad)" 
    stroke="url(#strokeGrad)" 
    stroke-width="20"
  />

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.18" />

  <!-- Monogram text 'EO' -->
  <text 
    x="244" 
    y="330" 
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="220" 
    font-weight="900" 
    letter-spacing="-8"
    text-anchor="middle" 
    fill="url(#textGrad)"
  >EO</text>

  <!-- Luminous Cyan Tech Dot -->
  <circle cx="396" cy="320" r="22" fill="#38bdf8" />
</svg>
